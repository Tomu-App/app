name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          node-version-file: .node-version
          cache: true
          require-lockfile: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm --filter @tomu/web build
        env:
          PUBLIC_API_URL: http://localhost:3000

  web:
    needs: ci
    # Same switch as the image: the app is useless without its API.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # CLOUDFLARE_API_TOKEN is an environment secret of "production" (restricted to branch main).
    environment: production
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          node-version-file: .node-version
          cache: true
          require-lockfile: true
      - run: pnpm --filter @tomu/web build
        env:
          PUBLIC_API_URL: https://api.tomu.foo
      - name: Deploy
        run: pnpm --filter @tomu/web exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  # Tells the image job whether this push to main touched anything that ends up in the server image.
  changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.diff.outputs.server }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # No usable "before" (first push, force push): build to be safe.
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "server=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Server and shared code, the lockfile, the toolchain and this workflow; not tests or docs.
          if git diff --name-only "$BEFORE" "$GITHUB_SHA" \
            | grep -vE '^apps/server/(test|deploy)/|\.md$' \
            | grep -qE '^(apps/server/|packages/shared/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|\.bun-version$|\.github/workflows/ci\.yml$)'; then
            echo "server=true" >> "$GITHUB_OUTPUT"
          else
            echo "server=false" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: [ci, changes]
    # Stays off until the VPS setup (apps/server/deploy/README.md) is done. Builds on a version tag,
    # or on a push to main that changed the image. !cancelled() lets it run when "changes" is skipped (tags).
    if: >-
      !cancelled() && needs.ci.result == 'success' && vars.DEPLOY_ENABLED == 'true' &&
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' && needs.changes.outputs.server == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          node-version-file: .node-version
          cache: true
          require-lockfile: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: pnpm --filter @tomu/server build
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # "latest" follows main only, so tagging an older commit never moves it back.
      # A version tag v1.2.3 publishes ghcr.io/tomu-app/server:1.2.3.
      - id: tags
        run: |
          {
            echo "list<<EOF"
            if [[ "$GITHUB_REF" == refs/heads/main ]]; then echo "ghcr.io/tomu-app/server:latest"; fi
            echo "ghcr.io/tomu-app/server:sha-$GITHUB_SHA"
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "ghcr.io/tomu-app/server:${GITHUB_REF_NAME#v}"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/server
          push: true
          tags: ${{ steps.tags.outputs.list }}
