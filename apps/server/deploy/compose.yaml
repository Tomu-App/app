services:
  app:
    image: ghcr.io/tomu-app/server:latest
    restart: unless-stopped
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS in .env}
    volumes:
      - data:/data

  # Outbound-only connection to Cloudflare; no ports are published on the host.
  # Public hostname api.tomu.foo -> http://app:3000 is configured in the dashboard.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    depends_on: [app]
    # Spec: no IPs and no full URLs in logs. Request errors (e.g. a 502 during a restart)
    # carry the full URL, so the main log shows only fatal errors. Connection problems
    # stay visible through the transport log.
    command: tunnel --no-autoupdate --loglevel fatal --transport-loglevel warn run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}

volumes:
  # Created once by hand (docker volume create tomu_data). External, so
  # `docker compose down -v` never deletes it, and the name does not depend
  # on the folder name of the Compose project.
  data:
    external: true
    name: tomu_data
